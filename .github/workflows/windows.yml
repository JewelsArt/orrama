# The gate on Windows, by hand (Actions → Windows → Run workflow).
#
# The backup is audited on Windows, where the server suite used to fail 43 of 60
# files on POSIX assumptions (audit OPS-003). Not on every push: a Windows
# runner costs twice a Linux one on a private repo, and Basalt runs on macOS.
# Run it before a release, or after touching paths, files or processes.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check-windows:
    name: typecheck · test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
