# The desktop shell compiles (audit OPS-004): Cargo.lock, the crate and
# tauri.conf.json changes were never built by CI. `cargo check`, not
# `tauri build` — a bundle nobody downloads is minutes for nothing. Runs
# weekly and by hand (`gh workflow run desktop.yml --ref main`), not on push:
# the shell changes rarely, and minutes on a private repo are counted. Run it
# after touching apps/desktop and before a release.
name: Desktop

on:
  schedule:
    # Sunday 22:30 UTC, on main.
    - cron: "30 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-check:
    name: cargo check (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The webview and its friends, as Tauri's Linux prerequisites list them.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
