# Release builds of the desktop app (stage 2, 2D): the Windows installer, built and checked on a
# Windows runner and put on a draft GitHub release. On a v* tag, and by hand:
#
#   gh workflow run release.yml --ref main -f version=0.1.0             (Windows only)
#   gh workflow run release.yml --ref main -f version=0.1.0 -f mac=true (and the Mac .dmg)
#
# Windows: `scripts/release-build.mjs` (the licence guards, the web app, the pinned Node, the server
# bundle, the notices, `tauri build` → Orrama_<version>_x64-setup.exe, unsigned: SmartScreen's "More
# info → Run anyway" for the friends' round), then `scripts/install-check.mjs`: a silent install
# into a temp folder, the installed Node runs the installed server on an empty data folder,
# /api/health answers with its launch id, closing its stdin stops it with exit 0, a silent
# uninstall, the notes folder still there. ~20 minutes on a 2x runner: ~40 billed minutes.
#
# The Mac is built on Jules's Mac while the repository is private (`pnpm --dir apps/desktop
# release:mac`, then `gh release upload v<version> <dmg>`): a macOS runner costs 10x, about 120
# billed minutes a build. The mac input runs the same steps on macos-14 when it is wanted.
#
# A tag v<version> makes the draft release v<version>. By hand, the draft is a test build,
# v<version>-test.<run number>, on this commit: delete it when done, never publish it. Only these
# jobs may write to the repository (contents: write), and only to make the draft and upload to it.
#
# Updates (2E). Every installed Orrama reads releases/latest/download/latest.json at launch and
# every 6 hours. With the updater key in the repository's secrets (TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD; Jules keeps the key and its password, never in the repo),
# the build signs its update bundle, and the job puts it and its entry in the draft's latest.json
# (`scripts/release-feed.mjs`). A tag run without the key fails; a run by hand without it is a test
# build with no feed. The Mac entry is added on Jules's Mac (README "Updates", the same script).
# Only then is the release published (`release-feed.mjs check`, then `gh release edit v<version>
# --draft=false --latest`): a draft is never "latest", so no installed app sees it before.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The app's version, as in apps/desktop/src-tauri/tauri.conf.json
        required: true
        type: string
      mac:
        description: Also build the Mac .dmg on a macOS runner (10x the minutes while the repository is private)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Two runs for one version would race for the same draft.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  windows:
    name: Windows installer (build · install check · draft)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # The Rust Jules's Mac builds with, so both platforms compile the same shell.
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - run: pnpm install --frozen-lockfile
      - name: the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"
      - name: build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-build.mjs --target x86_64-pc-windows-msvc
      # The Node it ships is nodejs.org's, its OpenJS signature intact (fetch-node checks a
      # certificate table is there; only Windows can say it is valid).
      - name: Node's signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature apps/desktop/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "node.exe's signature is $($sig.Status)" }
      - name: install, run, stop, uninstall
        run: node scripts/install-check.mjs --installer "apps/desktop/src-tauri/target/release/bundle/nsis/Orrama_${{ steps.version.outputs.version }}_x64-setup.exe"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA. Unsigned: Windows SmartScreen says More info, then Run anyway." || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "apps/desktop/src-tauri/target/release/bundle/nsis/Orrama_${{ steps.version.outputs.version }}_x64-setup.exe" --clobber
      # The installer is also the Windows update bundle; its .sig is the updater key's signature.
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          EXE: apps/desktop/src-tauri/target/release/bundle/nsis/Orrama_${{ steps.version.outputs.version }}_x64-setup.exe
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "::error::a release needs the updater key: TAURI_SIGNING_PRIVATE_KEY and _PASSWORD in the repository's secrets"; exit 1; fi
            echo "::notice::no updater key in the secrets: a test build with no update bundle and no feed"; exit 0
          fi
          mkdir -p feed
          gh release download "$TAG" -p latest.json -D feed || true
          node scripts/release-feed.mjs add --feed feed/latest.json --version "$VERSION" --platform windows-x86_64 --asset "$EXE" --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" "$EXE.sig" feed/latest.json --clobber

  mac:
    name: Mac .dmg (build · run check · draft)
    if: inputs.mac
    # After Windows: both jobs write the draft's latest.json.
    needs: windows
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - run: pnpm install --frozen-lockfile
      - name: the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/release-version.mjs >> "$GITHUB_OUTPUT"
      - name: build the .dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-build.mjs --target aarch64-apple-darwin
      - name: run the built app's server, stop it
        run: node scripts/install-check.mjs --app apps/desktop/src-tauri/target/release/bundle/macos/Orrama.app
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "Built by $GITHUB_WORKFLOW run $GITHUB_RUN_ID from $GITHUB_SHA." || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" "apps/desktop/src-tauri/target/release/bundle/dmg/Orrama_${{ steps.version.outputs.version }}_aarch64.dmg" --clobber
      # The update bundle is Orrama.app.tar.gz; uploaded under a name that says its version.
      - name: update feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          BUNDLE: apps/desktop/src-tauri/target/release/bundle
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "::error::a release needs the updater key: TAURI_SIGNING_PRIVATE_KEY and _PASSWORD in the repository's secrets"; exit 1; fi
            echo "::notice::no updater key in the secrets: a test build with no update bundle and no feed"; exit 0
          fi
          TGZ="$BUNDLE/Orrama_${VERSION}_aarch64.app.tar.gz"
          cp "$BUNDLE/macos/Orrama.app.tar.gz" "$TGZ"
          cp "$BUNDLE/macos/Orrama.app.tar.gz.sig" "$TGZ.sig"
          mkdir -p feed
          gh release download "$TAG" -p latest.json -D feed || true
          node scripts/release-feed.mjs add --feed feed/latest.json --version "$VERSION" --platform darwin-aarch64 --asset "$TGZ" --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" "$TGZ" "$TGZ.sig" feed/latest.json --clobber
