# The tests only protect anything if something other than a person remembering
# runs them. This is that something.
#
# Jobs: typecheck + every package's tests + the web build on Ubuntu, and a
# dependency audit — every push to main, every PR, and by hand. Only main:
# sep-2026-redesign is pushed with the same commit, and a second run of it
# bought nothing but minutes. The slow and dear runners have their own
# workflows, weekly (Sunday night, on main) and by hand: macos.yml (10x the
# minutes on a private repo), windows.yml (2x), desktop.yml (cargo check);
# docker.yml also runs when the image's own files or the lockfile change.
# Before a release: `gh workflow run <file> --ref main` for each of the four.
#
# Deliberately NOT `pnpm build`: that fans out to apps/desktop, which is Tauri
# and needs a Rust toolchain — minutes of compilation to produce a .dmg no CI
# consumer wants. The server needs no build step at all (it runs TypeScript
# through tsx), so the only bundle worth building here is apps/web.
#
# Every action is pinned to a commit, the tag kept as a comment: a tag can be
# moved to new code, and that code would run with this job's token and the
# checked-out repo (audit OPS-004).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the repo, nothing else. No job here writes to GitHub.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile, so CI fails on a lockfile that disagrees with the
      # manifests rather than quietly resolving something else than the machine
      # this was developed on.
      - run: pnpm install --frozen-lockfile

      # Every package with a typecheck script, apps/mcp among them.
      - run: pnpm typecheck

      # The React hooks rules on apps/web (eslint.config.js), so a hook's
      # dependency list cannot go stale unnoticed.
      - run: pnpm lint

      # Every package's tests: core, sync, server, web and mcp. Caching is off
      # for this task in turbo.json — a replayed log is not a test run.
      - run: pnpm test

      - run: pnpm --dir apps/web build

  # Advisories in production dependencies (audit OPS-002). Blocking since the
  # wave D bumps: an advisory judged unreachable goes into
  # auditConfig.ignoreGhsas in pnpm-workspace.yaml with its reason.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - run: pnpm audit --prod --audit-level=high
