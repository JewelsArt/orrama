# Rust is only the shell (spec §4): the window around the local server.
# All product logic lives in TypeScript packages shared with web and server.
[package]
name = "orrama-desktop"
version = "0.1.0"
edition = "2021"
# GNU AGPL v3 or later (LICENSE at the repository root); never published to crates.io.
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "orrama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
