# Rust is only the shell (spec §4): the window around the local server.
# All product logic lives in TypeScript packages shared with web and server.
[package]
name = "orrama-desktop"
version = "0.1.0"
edition = "2021"
# GNU AGPL v3 or later (LICENSE at the repository root); never published to crates.io.
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Official tauri-apps/plugins-workspace plugins, used from Rust only (no capability: no page gets their commands).
tauri-plugin-single-instance = "~2.4.5"
tauri-plugin-opener = "~2.5.5"
getrandom = "0.3"
# The secret store's keyring side (secrets.rs): Credential Manager on Windows, the Keychain on the Mac once the app is signed.
keyring-core = "1.0.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[lib]
name = "orrama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The download's size (2D, 25 Oct 2026): one codegen unit, whole-program LTO, size over speed,
# symbols stripped. Measured on the Mac: the shell's binary 10.3 MB → 4.5 MB, a clean release build
# 39 s → 74 s. The shell waits on a server and a webview; nothing in it is speed-bound.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
