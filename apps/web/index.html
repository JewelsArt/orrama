<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Orrama</title>
    <!-- The theme this device showed last, on <html> before the first frame (WEB-019). -->
    <script src="/boot-theme.js"></script>

    <!-- Installable to a phone home screen. "standalone" is what drops the
         Safari chrome, so it opens like an app rather than a bookmark.
         NOTE: iOS only honours the manifest over HTTPS. On http://<lan-ip> you
         get a bookmark with browser chrome; over Tailscale (real cert) you get
         the standalone app, and WebAuthn/Face ID starts working too. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3EFE8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090E1A" media="(prefers-color-scheme: dark)" />

    <!-- iOS ignores most of the manifest and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orrama" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Type: Figtree, served from this app (packages/ui/src/fonts.css), not Google Fonts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
